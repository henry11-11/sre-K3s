apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sre-workload-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: application-reliability.rules
      rules:
        # Alert 1: Pod CrashLoop / Excessive Restarts
        - alert: PodCrashLoopBackOff
          expr: increase(kube_pod_container_status_restarts_total{namespace="production"}[5m]) > 1
          for: 1m
          labels:
            severity: critical
            team: sre
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} restarted {{ $value }} times within the last 5 minutes."

        # Alert 2: High CPU Exhaustion
        - alert: HighCPUUsage
          expr: sum(rate(container_cpu_usage_seconds_total{namespace="production", container="microservice"}[1m])) by (pod) > 0.15
          for: 1m
          labels:
            severity: warning
            team: sre
          annotations:
            summary: "Pod {{ $labels.pod }} high CPU usage"
            description: "Pod {{ $labels.pod }} CPU consumption is {{ $value }} cores (exceeds 150m threshold) for more than 1 minute."

        # Alert 3: Pod Not Ready
        - alert: PodNotReady
          expr: kube_pod_status_phase{namespace="production", phase!="Running"} == 1
          for: 2m
          labels:
            severity: warning
            team: sre
          annotations:
            summary: "Pod {{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.pod }} has been in {{ $labels.phase }} state for over 2 minutes."
